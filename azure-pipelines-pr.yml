trigger: none  # Don't run on direct pushes

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - 'docs/**'

variables:
  acrLoginServer: 'boutiqueacrshared.azurecr.io'
  azureServiceConnection: 'Azure Resource Group'

stages:
- stage: ValidatePR
  displayName: 'PR Validation (Build + Scan)'
  jobs:

  - job: DetectChanges
    displayName: 'Detect Changed Services'
    pool:
      name: Default
    steps:
    - checkout: self
      fetchDepth: 2

    - script: |
        echo "Detecting changes for PR validation..."
        CHANGED_FILES=$(git diff --name-only HEAD HEAD~1 || echo "")
        echo "Changed files: $CHANGED_FILES"

        SERVICES_JSON=$(cat azure/services.json)

        if [ -z "$CHANGED_FILES" ]; then
          MATRIX=$(echo "$SERVICES_JSON" | jq -c '.')
        else
          MATCHING_KEYS=$(echo "$SERVICES_JSON" | jq -r --arg cf "$CHANGED_FILES" \
            'to_entries | map(select(.value.triggerPath as $p | ($cf | contains($p)))) | map(.key) | .[]')

          if [ -z "$MATCHING_KEYS" ]; then
            MATRIX=$(echo "$SERVICES_JSON" | jq -c '.')
          else
            MATRIX=$(echo "$SERVICES_JSON" | jq -c --arg keys "$MATCHING_KEYS" \
              'with_entries(select(.key | IN( ($keys | split("\n"))[] )))')
          fi
        fi

        echo "Matrix: $MATRIX"
        echo "##vso[task.setvariable variable=matrix;isOutput=true]$MATRIX"
      name: setMatrix
      displayName: 'Determine Changed Services'

  - job: BuildAndScan
    displayName: 'Build + Security Scan (no push)'
    dependsOn: DetectChanges
    pool:
      name: Default
    strategy:
      matrix: $[ dependencies.DetectChanges.outputs['setMatrix.matrix'] ]

    steps:
    - checkout: self
      fetchDepth: 0

    - task: NodeTool@0
      displayName: 'Use Node.js 20 LTS'
      inputs:
        versionSpec: '20.x'

    - script: |
        if [ -f "$(buildPath)/package.json" ]; then
          echo "Installing dependencies for $(service)..."
          cd $(buildPath)
          npm ci || npm install
        fi
      displayName: 'Install dependencies for SonarQube scan'

    - task: SonarQubePrepare@7
      displayName: 'SonarQube Prepare'
      inputs:
        SonarQube: 'SonarQubeServiceConnection'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'boutique-$(service)'
        cliProjectName: 'Boutique $(service)'
        cliSources: '$(buildPath)'
        extraProperties: |
          sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
          sonar.typescript.tsconfigPath=$(buildPath)/tsconfig.json

    - script: |
        PARAMS=$(echo $SONARQUBE_SCANNER_PARAMS | jq 'del(.["sonar.branch.name"])' -c)
        echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$PARAMS"
      displayName: 'Remove branch name for SonarQube Community Edition'

    - task: SonarQubeAnalyze@7
      displayName: 'SonarQube Analysis'

    - task: AzureCLI@2
      displayName: 'Build Docker image (no push)'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          az acr login --name boutiqueacrshared
          # Build only — do NOT push on PRs
          docker build \
            -f $(buildPath)/Dockerfile \
            -t $(acrLoginServer)/$(service):pr-$(System.PullRequest.PullRequestId) \
            $(buildPath)
          echo "Build successful — image NOT pushed (PR only)"

    - task: trivy@1
      displayName: 'Trivy Security Scan'
      inputs:
        image: '$(acrLoginServer)/$(service):pr-$(System.PullRequest.PullRequestId)'
        severity: 'CRITICAL,HIGH'
        exitCode: '0'

    - script: |
        # Clean up local PR image after scan
        docker rmi $(acrLoginServer)/$(service):pr-$(System.PullRequest.PullRequestId) || true
      displayName: 'Cleanup local PR image'
