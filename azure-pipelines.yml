trigger:
  branches:
    include:
      - main

parameters:
  - name: deployProd
    displayName: "Deploy to Prod"
    type: boolean
    default: false
  - name: buildAll
    displayName: "Force Build ALL Services"
    type: boolean
    default: false

variables:
  imageTag: '$(Build.SourceVersion)'
  acrLoginServer: 'boutiqueacrshared9p2x4.azurecr.io'
  azureServiceConnection: 'Azure Resource Group'

resources:
  repositories:
  - repository: gitops
    type: git
    name: boutique-gitops

stages:
- stage: BuildAndPush
  jobs:
  - job: GenerateMatrix
    displayName: 'Generate Build Matrix'
    pool:
      name: Default
    steps:
    - checkout: self
    - script: |
        echo "Building ALL services (detect change logic removed)."
        SERVICES_JSON=$(cat azure/services.json)
        MATRIX=$(echo "$SERVICES_JSON" | jq -c '.')
        CHANGED_LIST=$(echo "$MATRIX" | jq -r '.[].service' | tr '\n' ' ')
        echo "##vso[task.setvariable variable=matrix;isOutput=true]$MATRIX"
        echo "##vso[task.setvariable variable=changedServices;isOutput=true]$CHANGED_LIST"
      name: setMatrix
      displayName: 'Output Matrix variables' 
  
  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']

- stage: UpdateDev
  displayName: 'Deploy to Dev (GitOps)'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'dev'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateQA
  displayName: 'Deploy to QA (GitOps)'
  dependsOn: UpdateDev
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'qa'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateStaging
  displayName: 'Deploy to Staging (GitOps)'
  dependsOn: UpdateQA
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'staging'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateProd
  displayName: 'Deploy to Prod (GitOps)'
  dependsOn: UpdateStaging
  condition: and(succeeded(), ${{ parameters.deployProd }}, eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'prod'
      acrLoginServer: 'boutiqueacrprod9p2x4.azurecr.io'
