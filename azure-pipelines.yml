trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: acr-registries
  - name: imageTag
    value: '$(Build.SourceVersion)'
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:
- stage: CodeQuality
  displayName: 'Code Quality (SonarCloud)'
  jobs:
  - template: azure/templates/code-quality.yml

- stage: Test
  displayName: 'Test'
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/test.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']

- stage: BuildAndScan
  displayName: 'Build, Scan & Push Images'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']
      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        pushImage: false
      ${{ else }}:
        pushImage: true

# Deployment is not part of this pipeline. Each environment is deployed by
# its Azure DevOps Release pipeline, which consumes the deploy-info artifact
# published above and runs `helm upgrade --install` with the chart from
# boutique-gitops (helm/boutique-app). The cluster platform layer it depends
# on is installed by boutique-infra's platform pipeline.
