trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: acr-registries
  - name: imageTag
    value: '$(Build.SourceVersion)'
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:
- stage: CodeQuality
  displayName: 'Code Quality (SonarCloud)'
  jobs:
  - template: azure/templates/code-quality.yml

- stage: Test
  displayName: 'Test'
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/test.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']

- stage: BuildAndScan
  displayName: 'Build, Scan & Push Images'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']
      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        pushImage: false
      ${{ else }}:
        pushImage: true

# Deployment beyond this point is intentionally not part of this pipeline
# right now. Dev is deployed by the "boutique-app - Dev" Azure DevOps
# Release pipeline, which consumes the deploy-info artifact published
# above and applies the Helm chart directly (see boutique-gitops
# Application boutique-azure-dev, switched to manual ArgoCD sync on
# 2026-09-23 for this reason).
#
# QA/Staging/Prod Applications in boutique-gitops are still on automated
# ArgoCD sync, but nothing in this pipeline updates their values-*.yaml
# image tags anymore, so they're effectively frozen on whatever tag was
# last pushed there rather than tracking new builds. See
# backup/main-2026-09-23-pre-ado-release for the previous
# UpdateQA/UpdateStaging/UpdateProd GitOps stages if this needs to be
# restored or extended to other environments later.
