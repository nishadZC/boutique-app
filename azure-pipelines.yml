trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: deployProd
    displayName: "Deploy to Prod"
    type: boolean
    default: false
  - name: buildAll
    displayName: "Force Build ALL Services"
    type: boolean
    default: false

variables:
  imageTag: '$(Build.SourceVersion)'
  acrLoginServer: 'boutiqueacrshared9p2x4.azurecr.io'
  azureServiceConnection: 'Azure Resource Group'

resources:
  repositories:
  - repository: gitops
    type: git
    name: boutique-gitops

stages:
- stage: Validate
  displayName: 'PR Validation (Build, Sonar, Trivy)'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']
      pushImage: false

- stage: BuildAndPush
  displayName: 'Build, Scan & Push Images'
  condition: ne(variables['Build.Reason'], 'PullRequest')
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']
      pushImage: true

- stage: UpdateDev
  displayName: 'Deploy to Dev (GitOps)'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'dev'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateQA
  displayName: 'Deploy to QA (GitOps)'
  dependsOn: UpdateDev
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'qa'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateStaging
  displayName: 'Deploy to Staging (GitOps)'
  dependsOn: UpdateQA
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'staging'
      acrLoginServer: '$(acrLoginServer)'

- stage: UpdateProd
  displayName: 'Deploy to Prod (GitOps)'
  dependsOn: UpdateStaging
  condition: and(succeeded(), ${{ parameters.deployProd }}, eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'prod'
      acrLoginServer: 'boutiqueacrprod9p2x4.azurecr.io'
