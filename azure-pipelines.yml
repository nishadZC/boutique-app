trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: deployBeyondDev
    displayName: "Deploy to QA/Staging (GitOps)"
    type: boolean
    default: false
  - name: deployProd
    displayName: "Deploy to Prod"
    type: boolean
    default: false

variables:
  - group: acr-registries
  - name: imageTag
    value: '$(Build.SourceVersion)'
  - name: azureServiceConnection
    value: 'Azure Resource Group'

resources:
  repositories:
  - repository: gitops
    type: git
    name: boutique-gitops

stages:
- stage: CodeQuality
  displayName: 'Code Quality (SonarCloud)'
  jobs:
  - template: azure/templates/code-quality.yml

- stage: Test
  displayName: 'Test'
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/test.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']

- stage: BuildAndScan
  displayName: 'Build, Scan & Push Images'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - template: azure/templates/generate-matrix.yml

  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: GenerateMatrix
      matrix: dependencies.GenerateMatrix.outputs['setMatrix.matrix']
      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        pushImage: false
      ${{ else }}:
        pushImage: true

# Dev no longer deploys via this GitOps stage: it's deployed by the
# "boutique-app - Dev" Azure DevOps Release pipeline, which consumes the
# deploy-info pipeline artifact published in BuildAndScan and applies the
# Helm chart directly (see boutique-gitops Application boutique-azure-dev,
# switched to manual ArgoCD sync on 2026-09-23 for this reason).

- stage: UpdateQA
  displayName: 'Deploy to QA (GitOps)'
  dependsOn: BuildAndScan
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), ${{ parameters.deployBeyondDev }})
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'qa'
      acrLoginServer: '$(qaAcr).azurecr.io'

- stage: UpdateStaging
  displayName: 'Deploy to Staging (GitOps)'
  dependsOn: UpdateQA
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'staging'
      acrLoginServer: '$(stagingAcr).azurecr.io'

- stage: UpdateProd
  displayName: 'Deploy to Prod (GitOps)'
  dependsOn: UpdateStaging
  condition: and(succeeded(), ${{ parameters.deployProd }}, eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      environment: 'prod'
      acrLoginServer: '$(prodAcr).azurecr.io'
