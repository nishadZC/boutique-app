trigger: none

variables:
  imageTag: '$(Build.SourceVersion)'
  acrLoginServer: 'boutiqueacrshared.azurecr.io'
  azureServiceConnection: 'Azure Resource Group'

resources:
  repositories:
  - repository: gitops
    type: git
    name: boutique-gitops

stages:
- stage: BuildAndPush
  jobs:
  - template: azure/templates/detect-changes.yml
  
  - template: azure/templates/build-push.yml
    parameters:
      dependsOn: DetectChanges
      matrix: dependencies.DetectChanges.outputs['setMatrix.matrix']

- stage: UpdateDev
  displayName: 'Deploy to Dev (GitOps)'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      changedServices: stageDependencies.BuildAndPush.DetectChanges.outputs['setMatrix.changedServices']
      environment: 'dev'

- stage: UpdateProd
  displayName: 'Deploy to Prod (GitOps)'
  dependsOn: UpdateDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - template: azure/templates/update-gitops.yml
    parameters:
      changedServices: stageDependencies.BuildAndPush.DetectChanges.outputs['setMatrix.changedServices']
      environment: 'prod'
