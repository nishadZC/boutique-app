trigger: none

variables:
  imageTag: '$(Build.SourceVersion)'
  acrLoginServer: 'boutiqueacrshared.azurecr.io'
  dockerRegistryServiceConnection: 'boutique-acr-svc-conn'

stages:
- stage: BuildAndPush
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      matrix:
        auth:
          service: 'auth'
        gateway:
          service: 'gateway'
        orders:
          service: 'orders'
        product_service:
          service: 'product-service'

        frontend:
          service: 'frontend'
    
    steps:
    - checkout: self
      fetchDepth: 0
      
    - task: SonarQubePrepare@7
      inputs:
        SonarQube: 'SonarQubeServiceConnection'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'boutique-$(service)'
        cliProjectName: 'Boutique $(service)'

    - script: |
        if [ "$(service)" == "frontend" ]; then
          echo "##vso[task.setvariable variable=BUILD_PATH]projects/boutique-microservices/frontend"
        else
          echo "##vso[task.setvariable variable=BUILD_PATH]projects/boutique-microservices/backend/services/$(service)"
        fi
      displayName: 'Set Build Path'

    - script: |
        PARAMS=$(echo $SONARQUBE_SCANNER_PARAMS | jq 'del(.["sonar.branch.name"])' -c)
        echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$PARAMS"
      displayName: 'Remove branch name for SonarQube Community Edition'

    - task: SonarQubeAnalyze@7
      
    - task: Docker@2
      displayName: Build and Push image to ACR
      inputs:
        command: buildAndPush
        repository: $(service)
        dockerfile: '$(BUILD_PATH)/Dockerfile'
        buildContext: '$(BUILD_PATH)'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(imageTag)
          latest

    - task: trivy@1
      inputs:
        image: '$(acrLoginServer)/$(service):$(imageTag)'
        severity: 'CRITICAL,HIGH'
        exitCode: '0'

- stage: UpdateManifests
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - job: UpdateGitOps
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      persistCredentials: true

    - script: |
        NEW_TAG=$(Build.SourceVersion)
        REGISTRY=$(acrLoginServer)

        for SERVICE in auth gateway orders product-service; do
          MANIFEST="gitops/azure/base/k8s/backend/${SERVICE}.yml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|image:.*|image: ${REGISTRY}/${SERVICE}:${NEW_TAG}|g" $MANIFEST
          fi
        done

        FRONTEND_MANIFEST="gitops/azure/base/k8s/frontend/deployment.yml"
        if [ -f "$FRONTEND_MANIFEST" ]; then
          sed -i "s|image:.*|image: ${REGISTRY}/frontend:${NEW_TAG}|g" $FRONTEND_MANIFEST
        fi
      displayName: 'Update image tags in GitOps manifests'

    - script: |
        git config user.name "azure-devops"
        git config user.email "azure-devops@boutique.com"
        git add gitops/azure/base/
        git diff --staged --quiet || git commit -m "ci: update ACR image tags to $(Build.SourceVersion)"
        git push origin HEAD:main
      displayName: 'Commit and push changes'
