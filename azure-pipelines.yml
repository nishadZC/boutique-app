trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

# Every service CI tests, builds, scans and pushes. Each entry becomes one
# parallel job in the Test and BuildAndScan stages. Add a new service here.
parameters:
  - name: services
    type: object
    default:
      auth:            { service: auth,              buildPath: backend/services/auth }
      gateway:         { service: gateway,           buildPath: backend/services/gateway }
      orders:          { service: orders,            buildPath: backend/services/orders }
      product_service: { service: product-service,   buildPath: backend/services/product-service }
      payment:         { service: payment,           buildPath: backend/services/payment }
      skin_tone:       { service: skin-tone-service, buildPath: backend/services/skin-tone-service }
      user_service:    { service: user-service,      buildPath: backend/services/user-service }
      wishlist:        { service: wishlist-service,  buildPath: backend/services/wishlist-service }
      frontend:        { service: frontend,          buildPath: frontend }

variables:
  - group: acr-registries
  - name: imageTag
    value: '$(Build.SourceVersion)'
  - name: azureServiceConnection
    value: 'Azure Resource Group'

stages:
- stage: CodeQuality
  displayName: 'Code Quality (SonarCloud)'
  jobs:
  - template: azure/templates/code-quality.yml

- stage: Test
  displayName: 'Test'
  jobs:
  - template: azure/templates/test.yml
    parameters:
      matrix: ${{ parameters.services }}

- stage: BuildAndScan
  displayName: 'Build, Scan & Push Images'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - template: azure/templates/build-push.yml
    parameters:
      matrix: ${{ parameters.services }}
      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        pushImage: false
      ${{ else }}:
        pushImage: true

# Deployment is not part of this pipeline. Each environment is deployed by
# its Azure DevOps Release pipeline, which consumes the deploy-info artifact
# published above and runs `helm upgrade --install` with the chart from
# boutique-gitops (helm/boutique-app). The cluster platform layer it depends
# on is installed by boutique-infra's platform pipeline.
