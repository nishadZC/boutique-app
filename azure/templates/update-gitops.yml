parameters:
  - name: environment
    type: string
    default: 'dev'
  - name: acrLoginServer
    type: string
    default: 'boutiqueacrshared9p2x4.azurecr.io'

jobs:
- deployment: UpdateGitOps
  displayName: 'Deploy to ${{ parameters.environment }}'
  pool:
    name: Default
  environment: 'app-${{ parameters.environment }}-environment'
  variables:
    changedServices: $[ stageDependencies.BuildAndPush.GenerateMatrix.outputs['setMatrix.changedServices'] ]
    environment: ${{ parameters.environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: gitops
          persistCredentials: true

        - script: |
            set -e
            NEW_TAG="$(Build.SourceVersion)"
            REGISTRY="${{ parameters.acrLoginServer }}"
            CHANGED_SERVICES="$(changedServices)"
            ENV="${{ parameters.environment }}"
            VALUES_FILE="helm/boutique-app/values-${ENV}.yaml"

            git config user.name "azure-devops"
            git config user.email "azure-devops@boutique.com"

            echo "Updating tags for services: $CHANGED_SERVICES in $ENV environment"

            # Retry loop — handles concurrent jobs updating the same values file
            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Attempt $i / $MAX_RETRIES"

              # Always pull latest main FIRST before making any changes
              # This avoids rebase conflicts caused by concurrent service jobs
              git fetch origin main
              git reset --hard origin/main

              # Apply image tag changes on top of latest main
              if [ -f "$VALUES_FILE" ]; then
                for SERVICE in $CHANGED_SERVICES; do
                  case "$SERVICE" in
                    product-service)   KEY="productService" ;;
                    skin-tone-service) KEY="skinToneService" ;;
                    user-service)      KEY="user" ;;
                    wishlist-service)  KEY="wishlist" ;;
                    frontend)          KEY="frontend" ;;
                    *)                 KEY="$SERVICE" ;;
                  esac
                  sed -i "s|${KEY}: .*|${KEY}: ${REGISTRY}/${SERVICE}:${NEW_TAG}|g" $VALUES_FILE
                  echo "  Updated $KEY -> ${REGISTRY}/${SERVICE}:${NEW_TAG}"
                done
              else
                echo "WARNING: $VALUES_FILE not found, skipping"
                exit 0
              fi

              # Commit only if there are actual changes
              git add "$VALUES_FILE"
              if git diff --staged --quiet; then
                echo "No changes to commit — image tags already up to date"
                exit 0
              fi

              git commit -m "ci: update Helm values image tags for $ENV to ${NEW_TAG}"

              # Try to push — if it fails (someone else pushed concurrently), retry
              if git push origin HEAD:main; then
                echo "Push successful on attempt $i"
                exit 0
              else
                echo "Push failed (concurrent update detected) — retrying in ${i}s..."
                sleep $i
              fi
            done

            echo "##[error]Failed to push after $MAX_RETRIES attempts"
            exit 1
          displayName: 'Update image tags and push to GitOps repo (with retry)'
