parameters:
  - name: environment
    type: string
    default: 'dev'
  - name: acrLoginServer
    type: string
    default: 'boutiqueacrshared.azurecr.io'

jobs:
- deployment: UpdateGitOps
  displayName: 'Deploy to ${{ parameters.environment }}'
  pool:
    vmImage: 'ubuntu-latest'
  environment: 'app-${{ parameters.environment }}-environment'
  variables:
    changedServices: $[ stageDependencies.BuildAndPush.DetectChanges.outputs['setMatrix.changedServices'] ]
    environment: ${{ parameters.environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: gitops
          persistCredentials: true

        - script: |
            set -e
            NEW_TAG=$(Build.SourceVersion)
            REGISTRY="${{ parameters.acrLoginServer }}"
            CHANGED_SERVICES="$(changedServices)"
            ENV="$(environment)"
            
            echo "Updating tags for services: $CHANGED_SERVICES in $ENV environment"
            
            VALUES_FILE="helm/boutique-app/values-${ENV}.yaml"
            if [ -f "$VALUES_FILE" ]; then
              for SERVICE in $CHANGED_SERVICES; do
                case "$SERVICE" in
                  product-service) KEY="productService" ;;
                  skin-tone-service) KEY="skinToneService" ;;
                  user-service) KEY="user" ;;
                  wishlist-service) KEY="wishlist" ;;
                  frontend) KEY="frontend" ;;
                  *) KEY="$SERVICE" ;;
                esac
                sed -i "s|${KEY}: .*|${KEY}: ${REGISTRY}/${SERVICE}:${NEW_TAG}|g" $VALUES_FILE
              done
            fi
          displayName: 'Update image tags in values.yaml'

        - script: |
            set -e
            ENV="$(environment)"
            git config user.name "azure-devops"
            git config user.email "azure-devops@boutique.com"
            git add helm/boutique-app/values-${ENV}.yaml
            git diff --staged --quiet || git commit -m "ci: update Helm values image tags for $ENV to $(Build.SourceVersion)"
            git push origin HEAD:master
          displayName: 'Commit and push changes to GitOps repo'
