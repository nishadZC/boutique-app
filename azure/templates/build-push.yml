parameters:
  - name: dependsOn
    type: string
    default: DetectChanges
  - name: matrix
    type: string

jobs:
- job: Build
  dependsOn: ${{ parameters.dependsOn }}
  pool:
    name: Default
  strategy:
    matrix: $[ ${{ parameters.matrix }} ]
  
  steps:
  - checkout: self
    fetchDepth: 0
    
  - task: NodeTool@0
    displayName: 'Use Node.js 20 LTS'
    inputs:
      versionSpec: '20.x'

  - script: |
      if [ -f "$(buildPath)/package.json" ]; then
        echo "Installing dependencies for $(service)..."
        cd $(buildPath)
        npm ci || npm install
      fi
    displayName: 'Install dependencies for SonarQube scan'

  - task: SonarQubePrepare@7
    inputs:
      SonarQube: 'SonarQubeServiceConnection'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'boutique-$(service)'
      cliProjectName: 'Boutique $(service)'
      cliSources: '$(buildPath)'
      extraProperties: |
        sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
        sonar.typescript.tsconfigPath=$(buildPath)/tsconfig.json
        sonar.branch.name=master

  - script: |
      PARAMS=$(echo $SONARQUBE_SCANNER_PARAMS | jq '.["sonar.branch.name"] = "master"' -c)
      echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$PARAMS"
    displayName: 'Set branch name to master for SonarQube'

  - task: SonarQubeAnalyze@7

  - task: AzureCLI@2
    displayName: Build image locally
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        az acr login --name boutiqueacrshared
        docker build -f $(buildPath)/Dockerfile -t $(acrLoginServer)/$(service):$(imageTag) -t $(acrLoginServer)/$(service):latest $(buildPath)

  - task: trivy@1
    displayName: Scan local image with Trivy
    inputs:
      image: '$(acrLoginServer)/$(service):$(imageTag)'
      severity: 'CRITICAL,HIGH'
      exitCode: '0'

  - task: AzureCLI@2
    displayName: Push image to ACR
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        az acr login --name boutiqueacrshared
        docker push $(acrLoginServer)/$(service) --all-tags
