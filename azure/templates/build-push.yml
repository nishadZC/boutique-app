parameters:
  - name: dependsOn
    type: string
    default: DetectChanges
  - name: matrix
    type: string
  - name: pushImage
    type: boolean
    default: true

jobs:
- job: Build
  dependsOn: ${{ parameters.dependsOn }}
  pool:
    name: Default
  strategy:
    matrix: $[ ${{ parameters.matrix }} ]
  
  steps:
  - checkout: self
    fetchDepth: 0

  - task: AzureCLI@2
    displayName: Build image locally
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        az acr login --name boutiqueacrshared9p2x4
        docker build -f $(buildPath)/Dockerfile -t $(acrLoginServer)/$(service):$(imageTag) -t $(acrLoginServer)/$(service):latest $(buildPath)

  - task: trivy@1
    displayName: Scan local image with Trivy
    inputs:
      image: '$(acrLoginServer)/$(service):$(imageTag)'
      severity: 'CRITICAL,HIGH'
      exitCode: '0'

  - ${{ if eq(parameters.pushImage, true) }}:
    - task: AzureCLI@2
      displayName: Push image to ACR
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          az acr login --name boutiqueacrshared9p2x4
          docker push $(acrLoginServer)/$(service) --all-tags
