parameters:
  - name: dependsOn
    type: string
    default: DetectChanges
  - name: matrix
    type: string
  - name: pushImage
    type: boolean
    default: true

jobs:
- job: Build
  dependsOn: ${{ parameters.dependsOn }}
  pool:
    name: Default
  strategy:
    matrix: $[ ${{ parameters.matrix }} ]
  
  steps:
  - checkout: self
    fetchDepth: 0
    
  - task: NodeTool@0
    displayName: 'Use Node.js 20 LTS'
    inputs:
      versionSpec: '20.x'

  - script: |
      if [ -f "$(buildPath)/package.json" ]; then
        echo "Installing dependencies for $(service)..."
        cd $(buildPath)
        npm ci || npm install
      fi
    displayName: 'Install dependencies for SonarCloud scan'

  - task: SonarCloudPrepare@2
    displayName: 'SonarCloud Prepare'
    inputs:
      SonarCloud: 'SonarQubeServiceConnection'
      organization: 'luxatelier'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'boutique-$(service)'
      cliProjectName: 'Boutique $(service)'
      cliSources: '$(buildPath)'
      extraProperties: |
        sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
        sonar.typescript.tsconfigPath=$(buildPath)/tsconfig.json

  - task: SonarCloudAnalyze@2
    displayName: 'SonarCloud Analysis'

  - task: SonarCloudPublish@2
    displayName: 'Publish SonarCloud Quality Gate'
    inputs:
      pollingTimeoutSec: '300'

  - task: AzureCLI@2
    displayName: Build image locally
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        az acr login --name boutiqueacrshared9p2x4
        docker build -f $(buildPath)/Dockerfile -t $(acrLoginServer)/$(service):$(imageTag) -t $(acrLoginServer)/$(service):latest $(buildPath)

  - task: trivy@1
    displayName: Scan local image with Trivy
    inputs:
      image: '$(acrLoginServer)/$(service):$(imageTag)'
      severity: 'CRITICAL,HIGH'
      exitCode: '0'

  - ${{ if eq(parameters.pushImage, true) }}:
    - task: AzureCLI@2
      displayName: Push image to ACR
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          az acr login --name boutiqueacrshared9p2x4
          docker push $(acrLoginServer)/$(service) --all-tags
