parameters:
  - name: dependsOn
    type: string
    default: DetectChanges
  - name: matrix
    type: string
  - name: pushImage
    type: boolean
    default: true

jobs:
- job: Build
  dependsOn: ${{ parameters.dependsOn }}
  pool:
    name: Default
  strategy:
    matrix: $[ ${{ parameters.matrix }} ]
  
  steps:
  - checkout: self
    fetchDepth: 0

  - task: AzureCLI@2
    displayName: Build image locally
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e
        docker build -f $(buildPath)/Dockerfile -t $(service):$(imageTag) -t $(service):latest $(buildPath)

  - task: trivy@1
    displayName: Scan local image with Trivy
    inputs:
      image: '$(service):$(imageTag)'
      severity: 'CRITICAL,HIGH'
      exitCode: '0'

  - ${{ if eq(parameters.pushImage, true) }}:
    - task: AzureCLI@2
      displayName: Push image to dev/qa/staging ACRs
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          # Each non-prod environment has its own ACR (no shared registry),
          # so the same build gets pushed to all three.
          for ACR in $(devAcr) $(qaAcr) $(stagingAcr); do
            REGISTRY="${ACR}.azurecr.io"
            az acr login --name $ACR
            docker tag $(service):$(imageTag) $REGISTRY/$(service):$(imageTag)
            docker tag $(service):$(imageTag) $REGISTRY/$(service):latest
            docker push $REGISTRY/$(service) --all-tags
          done
