parameters:
  - name: matrix
    type: object
  - name: pushImage
    type: boolean
    default: true

jobs:
- job: Build
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    matrix: ${{ parameters.matrix }}
  
  steps:
  - checkout: self

  - script: |
      set -e
      docker build -f $(buildPath)/Dockerfile -t $(service):$(imageTag) -t $(service):latest .
    displayName: Build image locally

  - task: trivy@2
    # Unique per service: the Trivy results tab tells reports apart by step
    # name, so identical names made it show the first job's report for all.
    displayName: Scan $(service) image with Trivy
    inputs:
      type: image
      target: '$(service):$(imageTag)'
      severities: 'CRITICAL,HIGH'
      # Report findings without failing the build (the step turns orange,
      # "SucceededWithIssues"). trivy@2 has no exitCode input.
      ignoreScanErrors: true

  - ${{ if eq(parameters.pushImage, true) }}:
    - task: AzureCLI@2
      displayName: Push image to dev ACR
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          # QA/staging ACRs are not provisioned yet; dev-only for now.
          REGISTRY="$(devAcr).azurecr.io"
          az acr login --name $(devAcr)
          docker tag $(service):$(imageTag) $REGISTRY/$(service):$(imageTag)
          docker tag $(service):$(imageTag) $REGISTRY/$(service):latest
          docker push $REGISTRY/$(service) --all-tags

- ${{ if eq(parameters.pushImage, true) }}:
  - job: PublishDeployInfo
    displayName: 'Publish deploy info for Release pipelines'
    dependsOn: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none

    - task: Bash@3
      displayName: 'Write image tag to deploy-info'
      inputs:
        targetType: 'inline'
        script: |
          set -e
          mkdir -p "$(Build.ArtifactStagingDirectory)/deploy"
          echo "$(imageTag)" > "$(Build.ArtifactStagingDirectory)/deploy/imageTag.txt"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish deploy-info artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/deploy'
        artifact: 'deploy-info'
        publishLocation: 'pipeline'
