jobs:
- job: CodeQuality
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    displayName: 'Use Node.js 20 LTS'
    inputs:
      versionSpec: '20.x'

  - script: |
      set -e
      echo "Installing dependencies for all workspaces..."
      npm ci || npm install
    displayName: 'Install dependencies for SonarCloud scan'

  # Coverage for SonarCloud. Test failures are reported by the Test stage, so a
  # failing suite here only means less coverage, not a failed scan.
  - script: |
      for w in frontend backend/services/auth backend/services/orders backend/services/payment backend/services/product-service backend/services/user-service; do
        npm test -w "$w" -- --coverage || echo "##vso[task.logissue type=warning]Tests failed in $w; its coverage may be incomplete"
      done
    displayName: 'Run tests with coverage'

  - task: SonarCloudPrepare@4
    displayName: 'SonarCloud Prepare'
    inputs:
      SonarQube: 'SonarQubeServiceConnection'
      organization: 'luxatelier-1'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: 'luxatelier-1_boutique-app'
      cliProjectName: 'Boutique App'
      cliSources: 'frontend,backend'
      extraProperties: |
        sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
        sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/services/auth/coverage/lcov.info,backend/services/orders/coverage/lcov.info,backend/services/payment/coverage/lcov.info,backend/services/product-service/coverage/lcov.info,backend/services/user-service/coverage/lcov.info
        sonar.coverage.exclusions=frontend/src/**/*.tsx,frontend/src/main.tsx,frontend/src/setupTests.ts,**/src/index.ts

  - task: SonarCloudAnalyze@4
    displayName: 'SonarCloud Analysis'
