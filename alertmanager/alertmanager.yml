global:
  resolve_timeout: 5m
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'pagerduty'

  routes:
  - match:
      severity: critical
    receiver: 'pagerduty'
    repeat_interval: 1h

receivers:
- name: 'pagerduty'
  pagerduty_configs:
  - routing_key_file: '/etc/alertmanager/pagerduty_key.txt'
    send_resolved: true
    description: '{{ template "pagerduty.default.description" . }}'
