services:
  postgres:
    image: postgres:15-alpine
    container_name: boutique-postgres
    environment:
      POSTGRES_DB: boutique_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_MULTIBYTE: auth_db,products_db,orders_db
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/init:/docker-entrypoint-initdb.d
    networks:
    - boutique-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres && psql -U postgres -d postgres -c 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  prometheus:
    image: prom/prometheus:latest
    container_name: boutique-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./prometheus/rules:/etc/prometheus/rules
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: grafana/grafana:latest
    container_name: boutique-grafana
    ports:
    - 3008:3000
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_INSTALL_PLUGINS=grafana-piechart-panel
    - GF_SECURITY_COOKIE_SECURE=true
    - GF_SECURITY_COOKIE_HTTPONLY=true
    volumes:
    - ./grafana/provisioning:/etc/grafana/provisioning
    - grafana_data:/var/lib/grafana
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
    - boutique-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  alertmanager:
    image: prom/alertmanager:latest
    container_name: boutique-alertmanager
    ports:
    - 9093:9093
    volumes:
    - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    - ./alertmanager/pagerduty_key.txt:/etc/alertmanager/pagerduty_key.txt
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    build:
      context: ./backend/services/gateway
      dockerfile: Dockerfile
    container_name: boutique-gateway
    ports:
    - 3001:3001
    environment:
    - NODE_ENV=production
    - PORT=3001
    - LOG_LEVEL=info
    - AUTH_SERVICE_URL=http://auth:3002
    - USER_SERVICE_URL=http://user-service:3004
    - PRODUCTS_SERVICE_URL=http://product-service:3003
    - ORDERS_SERVICE_URL=http://orders:3005
    - PAYMENTS_SERVICE_URL=http://payment:3006
    - WISHLIST_SERVICE_URL=http://wishlist-service:3007
    - SKIN_TONE_SERVICE_URL=http://skin-tone-service:5001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  auth:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: boutique-auth
    ports:
    - 3002:3002
    environment:
    - NODE_ENV=production
    - PORT=3002
    - LOG_LEVEL=info
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
    - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/auth_db
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@luxatelier.in}
    - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD
      in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  user-service:
    build:
      context: ./backend/services/user-service
      dockerfile: Dockerfile
    container_name: boutique-user-service
    ports:
    - 3004:3004
    environment:
    - NODE_ENV=production
    - PORT=3004
    - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/auth_db
    - AZURE_MAPS_SUBSCRIPTION_KEY=${AZURE_MAPS_SUBSCRIPTION_KEY:?Set AZURE_MAPS_SUBSCRIPTION_KEY
      in .env}
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3004/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
  product-service:
    build:
      context: ./backend/services/product-service
      dockerfile: Dockerfile
    container_name: boutique-products
    ports:
    - 3003:3003
    environment:
    - NODE_ENV=production
    - PORT=3003
    - LOG_LEVEL=info
    - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/products_db
    - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME in
      .env}
    - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY in .env}
    - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET in
      .env}
    - SKIN_TONE_SERVICE_URL=http://skin-tone-service:5001
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    - ORDERS_SERVICE_URL=http://orders:3005
    - USER_SERVICE_URL=http://user-service:3004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3003/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  wishlist-service:
    build:
      context: ./backend/services/wishlist-service
      dockerfile: Dockerfile
    container_name: boutique-wishlist
    ports:
    - 3007:3007
    environment:
    - NODE_ENV=production
    - PORT=3007
    - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/wishlist_db
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3007/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
    - boutique-network
    restart: unless-stopped
  orders:
    build:
      context: ./backend/services/orders
      dockerfile: Dockerfile
    container_name: boutique-order-management
    ports:
    - 3005:3005
    environment:
    - NODE_ENV=production
    - PORT=3005
    - LOG_LEVEL=info
    - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/orders_db
    - PRODUCTS_SERVICE_URL=http://product-service:3003
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3005/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  payment:
    build:
      context: ./backend/services/payment
      dockerfile: Dockerfile
    container_name: boutique-payment
    ports:
    - 3006:3006
    environment:
    - NODE_ENV=production
    - PORT=3006
    - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?Set RAZORPAY_KEY_ID in .env}
    - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?Set RAZORPAY_KEY_SECRET in .env}
    - ORDERS_SERVICE_URL=http://orders:3005
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      orders:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3006/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - boutique-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boutique-frontend
    ports:
    - 3000:80
    environment:
    - REACT_APP_API_URL=http://gateway:3001/api
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
    - boutique-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  skin-tone-service:
    build:
      context: ./backend/services/skin-tone-service
      dockerfile: Dockerfile
    container_name: boutique-skin-tone
    ports:
    - 5001:5001
    networks:
    - boutique-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:5001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  node-exporter:
    image: prom/node-exporter:latest
    container_name: boutique-node-exporter
    restart: unless-stopped
    networks:
    - boutique-network
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: boutique-postgres-exporter
    environment:
    - DATA_SOURCE_NAME=postgresql://postgres:postgres123@postgres:5432/postgres?sslmode=disable
    restart: unless-stopped
    networks:
    - boutique-network
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
networks:
  boutique-network:
    driver: bridge
