global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "rules/alerts.yml"
  - "rules/recording.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3001']

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:3002']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3004']

  - job_name: 'product-service'
    static_configs:
      - targets: ['product-service:3003']


  - job_name: 'orders'
    static_configs:
      - targets: ['orders:3005']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment:3006']

  - job_name: 'wishlist-service'
    static_configs:
      - targets: ['wishlist-service:3007']

  - job_name: 'skin-tone-service'
    static_configs:
      - targets: ['skin-tone-service:5001']


  - job_name: 'node-exporter'
    static_configs:
      - targets: ['boutique-node-exporter:9100']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
