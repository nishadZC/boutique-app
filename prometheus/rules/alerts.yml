# Generated alongside boutique-gitops PrometheusRule "boutique-alerts" - keep both in sync.
groups:
- name: service_availability
  rules:
  - alert: InstanceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Instance {{ $labels.instance }} down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

  - alert: BoutiqueServiceScaledToZero
    expr: kube_deployment_status_replicas_available{namespace="boutique-app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service {{ $labels.deployment }} has no available replicas"
      description: "The {{ $labels.deployment }} deployment in boutique-app has zero available replicas."

  - alert: HighErrorRate
    expr: |
      sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
      /
      sum by (job) (rate(http_requests_total[5m])) > 0.05
      and
      sum by (job) (rate(http_requests_total[5m])) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High HTTP error rate on {{ $labels.job }}"
      description: "More than 5% of requests are failing with 5xx (current ratio: {{ $value | humanizePercentage }})."

  - alert: ErrorBudgetSlowBurn
    expr: |
      job:slo_errors_per_request:ratio_rate6h > (6 * 0.005)
      and
      job:slo_errors_per_request:ratio_rate30m > (6 * 0.005)
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.job }} is burning its error budget"
      description: "Error ratio over 6h is {{ $value | humanizePercentage }}, more than 6x the 99.5% SLO allows. At this rate the 30-day error budget runs out in about 5 days."

- name: service_latency
  rules:
  - alert: HighRequestLatency
    expr: job:http_request_duration_seconds:p95{job!~"skin-tone.*"} > 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.job }} p95 latency above 1s"
      description: "95th percentile request latency is {{ $value | humanizeDuration }} (threshold 1s)."

  - alert: SkinToneAnalysisSlow
    expr: job:http_request_duration_seconds:p95{job=~"skin-tone.*"} > 15
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Skin-tone analysis p95 latency above 15s"
      description: "95th percentile analysis time is {{ $value | humanizeDuration }}; the Style Advisor will feel stuck."

- name: service_runtime
  rules:
  - alert: ServiceRestartingFrequently
    expr: changes(process_start_time_seconds[15m]) > 2
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.job }} restarted {{ $value }} times in 15 minutes"
      description: "{{ $labels.instance }} keeps restarting - check its logs for crashes or failing health checks."

  - alert: NodeEventLoopLagHigh
    expr: nodejs_eventloop_lag_p99_seconds > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Event loop blocked on {{ $labels.job }}"
      description: "p99 event loop lag on {{ $labels.instance }} is {{ $value | humanizeDuration }}; every request on this instance is delayed."

  - alert: FileDescriptorsNearLimit
    expr: process_open_fds / process_max_fds > 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.job }} is running out of file descriptors"
      description: "{{ $labels.instance }} is using {{ $value | humanizePercentage }} of its file descriptor limit (possible connection or socket leak)."

  - alert: DatabasePoolExhausted
    expr: db_pool_waiting_clients > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{{ $labels.job }} is waiting for database connections"
      description: "{{ $value }} queries on {{ $labels.instance }} have been queued for a pool connection for 5 minutes."

- name: database
  rules:
  - alert: PostgresDown
    expr: pg_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "PostgreSQL is unreachable"
      description: "postgres-exporter on {{ $labels.instance }} cannot connect to the database."

  - alert: PostgresTooManyConnections
    expr: sum by (instance) (pg_stat_activity_count) / max by (instance) (pg_settings_max_connections) > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "PostgreSQL connections above 80% of max_connections"
      description: "{{ $value | humanizePercentage }} of max_connections are in use; new connections will soon be refused."

  - alert: PostgresDeadlocks
    expr: increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[10m]) > 0
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: "Deadlocks in database {{ $labels.datname }}"
      description: "{{ $value }} deadlocks in the last 10 minutes."

  - alert: PostgresLongRunningTransaction
    expr: max by (instance, datname) (pg_stat_activity_max_tx_duration{datname!~"template.*"}) > 300
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Long-running transaction in {{ $labels.datname }}"
      description: "A transaction has been open for {{ $value | humanizeDuration }}; it holds locks and blocks vacuum."

  - alert: PostgresExporterScrapeError
    expr: pg_exporter_last_scrape_error == 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "postgres-exporter is failing to collect metrics"
      description: "Database dashboards and alerts on {{ $labels.instance }} are working from stale data."

- name: business
  rules:
  - alert: PaymentVerificationRateLow
    expr: |
      sum(increase(payments_verified_total[1h])) / sum(increase(payment_orders_created_total[1h])) < 0.5
      and
      sum(increase(payment_orders_created_total[1h])) >= 10
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "Fewer than half of started payments are completing"
      description: "Only {{ $value | humanizePercentage }} of payment orders created in the last hour were verified - check Razorpay and the payment service."

- name: host
  rules:
  - alert: HighMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High Memory Usage on {{ $labels.instance }}"
      description: "Memory usage is above 85% (current value: {{ $value | printf \"%.1f\" }}%)."

  - alert: HighCpuUsage
    expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on {{ $labels.instance }}"
      description: "CPU usage is {{ $value | printf \"%.1f\" }}% for 10 minutes."

  - alert: DiskSpaceLow
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Disk almost full on {{ $labels.instance }} ({{ $labels.mountpoint }})"
      description: "Only {{ $value | humanizePercentage }} space left."

- name: prometheus_self
  rules:
  - alert: PrometheusConfigReloadFailed
    expr: prometheus_config_last_reload_successful == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Prometheus configuration reload failed"
      description: "Prometheus is still running its previous configuration - check prometheus.yml."

  - alert: PrometheusRuleEvaluationFailures
    expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Prometheus rule evaluation is failing"
      description: "{{ $value }} rule evaluations failed in 5 minutes; some alerts may never fire."
