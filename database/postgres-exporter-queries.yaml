# Custom PostgreSQL exporter queries
# Exposes pg_settings as Prometheus metrics so Grafana can display them

pg_settings:
  query: |
    SELECT
      name,
      CASE unit
        WHEN '8kB'  THEN setting::numeric * 8192
        WHEN 'kB'   THEN setting::numeric * 1024
        WHEN 'MB'   THEN setting::numeric * 1048576
        WHEN 'GB'   THEN setting::numeric * 1073741824
        ELSE setting::numeric
      END AS setting_bytes,
      setting::numeric AS setting_raw
    FROM pg_settings
    WHERE name IN (
      'shared_buffers',
      'effective_cache_size',
      'maintenance_work_mem',
      'work_mem',
      'max_wal_size',
      'random_page_cost',
      'seq_page_cost',
      'max_worker_processes',
      'max_parallel_workers',
      'max_connections',
      'wal_buffers',
      'checkpoint_completion_target',
      'default_statistics_target',
      'max_wal_senders',
      'wal_level'
    )
  metrics:
    - name:
        usage: LABEL
        description: "PostgreSQL setting name"
    - setting_bytes:
        usage: GAUGE
        description: "PostgreSQL setting value in bytes (where applicable)"
    - setting_raw:
        usage: GAUGE
        description: "PostgreSQL setting raw numeric value"

pg_stat_user_tables:
  query: |
    SELECT
      schemaname,
      relname,
      seq_scan,
      seq_tup_read,
      idx_scan,
      idx_tup_fetch,
      n_tup_ins,
      n_tup_upd,
      n_tup_del,
      n_live_tup,
      n_dead_tup,
      vacuum_count,
      autovacuum_count,
      analyze_count,
      autoanalyze_count
    FROM pg_stat_user_tables
  metrics:
    - schemaname:
        usage: LABEL
        description: "Schema name"
    - relname:
        usage: LABEL
        description: "Table name"
    - seq_scan:
        usage: COUNTER
        description: "Number of sequential scans"
    - seq_tup_read:
        usage: COUNTER
        description: "Number of live rows fetched by sequential scans"
    - idx_scan:
        usage: COUNTER
        description: "Number of index scans"
    - idx_tup_fetch:
        usage: COUNTER
        description: "Number of live rows fetched by index scans"
    - n_tup_ins:
        usage: COUNTER
        description: "Number of rows inserted"
    - n_tup_upd:
        usage: COUNTER
        description: "Number of rows updated"
    - n_tup_del:
        usage: COUNTER
        description: "Number of rows deleted"
    - n_live_tup:
        usage: GAUGE
        description: "Estimated number of live rows"
    - n_dead_tup:
        usage: GAUGE
        description: "Estimated number of dead rows"
    - vacuum_count:
        usage: COUNTER
        description: "Number of times manually vacuumed"
    - autovacuum_count:
        usage: COUNTER
        description: "Number of times autovacuumed"
    - analyze_count:
        usage: COUNTER
        description: "Number of times manually analyzed"
    - autoanalyze_count:
        usage: COUNTER
        description: "Number of times autoanalyzed"

pg_database_size:
  query: |
    SELECT
      datname AS database,
      pg_database_size(datname) AS size_bytes
    FROM pg_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - database:
        usage: LABEL
        description: "Database name"
    - size_bytes:
        usage: GAUGE
        description: "Database size in bytes"
